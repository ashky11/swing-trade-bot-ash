name: Run EOD Swing Trade Bot

on:
  schedule:
    # 11:30 AM UTC = 5:00 PM IST (Monday to Friday)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

jobs:
  execute-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pandas beautifulsoup4 yfinance

      - name: Execute EOD Trade Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python eod_trade_bot_1.py
